name: KernelSU Next ARM32 Manager

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK / NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Setup NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Add ARMv7 ioctl header
        run: |
                - name: Add ARMv7 ioctl header
        run: |
          mkdir -p /usr/include/asm
          printf '#include <asm-generic/ioctl.h>\n' > /usr/include/asm/ioctl.h

          mkdir -p "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/arm-linux-androideabi/asm"
          printf '#include <asm-generic/ioctl.h>\n' > "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/arm-linux-androideabi/asm/ioctl.h"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add armv7-linux-androideabi

      - name: Build ARMv7 ksud
        working-directory: userspace/ksud
        env:
          BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi: >-
            --sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/arm-linux-androideabi
            -I$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang
          CC_armv7_linux_androideabi: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang
          CXX_armv7_linux_androideabi: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++
          AR_armv7_linux_androideabi: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB_armv7_linux_androideabi: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
        run: |
          cargo build \
            --target armv7-linux-androideabi \
            --release \
            --manifest-path Cargo.toml

      - name: Install ARMv7 ksud into Manager
        run: |
          mkdir -p manager/app/src/main/jniLibs/armeabi-v7a
          cp userspace/ksud/target/armv7-linux-androideabi/release/ksud \
            manager/app/src/main/jniLibs/armeabi-v7a/libksud.so

      - name: Verify ARMv7 ksud
        run: |
          file manager/app/src/main/jniLibs/armeabi-v7a/libksud.so
          readelf -h manager/app/src/main/jniLibs/armeabi-v7a/libksud.so | grep -E "Class|Machine"

      - name: Build Manager
        working-directory: manager
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          APK=$(find manager/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          test -n "$APK"

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.1.0"

          "$BUILD_TOOLS/zipalign" \
            -P 16 \
            -f 4 \
            "$APK" \
            dist/KernelSU_Next_ARM32_aligned.apk

      - name: Sign APK
        run: |
          mkdir -p dist

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ksu-arm32.jks" \
            -storepass "ksuarm32" \
            -keypass "ksuarm32" \
            -alias "ksu-arm32" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=KernelSU Next ARM32"

          "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" sign \
            --ks "$RUNNER_TEMP/ksu-arm32.jks" \
            --ks-key-alias "ksu-arm32" \
            --ks-pass pass:ksuarm32 \
            --key-pass pass:ksuarm32 \
            --out dist/KernelSU_Next_ARM32.apk \
            dist/KernelSU_Next_ARM32_aligned.apk

      - name: Verify APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" verify --verbose \
            dist/KernelSU_Next_ARM32.apk

          echo "===== APK native libraries ====="
          unzip -l dist/KernelSU_Next_ARM32.apk | grep "lib/"

          echo "===== ARM32 libraries ====="
          unzip -l dist/KernelSU_Next_ARM32.apk | grep "lib/armeabi-v7a/"

      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v7
        with:
          name: KernelSU-Next-ARM32
          path: dist/KernelSU_Next_ARM32.apk
          retention-days: 30

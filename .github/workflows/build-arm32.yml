name: ReFix KernelSU Next ARM32 Manager

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK / NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Setup NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Setup ARM32 Android tool aliases
        run: |
          NDK="$ANDROID_NDK_HOME"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          mkdir -p "$RUNNER_TEMP/android-arm32-bin"

          ln -sf "$TOOLCHAIN/llvm-ar" \
            "$RUNNER_TEMP/android-arm32-bin/arm-linux-androideabi-ar"

          ln -sf "$TOOLCHAIN/llvm-ranlib" \
            "$RUNNER_TEMP/android-arm32-bin/arm-linux-androideabi-ranlib"

          ln -sf "$TOOLCHAIN/llvm-strip" \
            "$RUNNER_TEMP/android-arm32-bin/arm-linux-androideabi-strip"

          ln -sf "$TOOLCHAIN/armv7a-linux-androideabi21-clang" \
            "$RUNNER_TEMP/android-arm32-bin/arm-linux-androideabi-clang"

          ln -sf "$TOOLCHAIN/armv7a-linux-androideabi21-clang++" \
            "$RUNNER_TEMP/android-arm32-bin/arm-linux-androideabi-clang++"

          echo "$RUNNER_TEMP/android-arm32-bin" >> "$GITHUB_PATH"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          echo "===== ARM32 tools ====="
          command -v arm-linux-androideabi-ar
          command -v arm-linux-androideabi-ranlib
          command -v arm-linux-androideabi-clang

      - name: Fix ARM32 ioctl headers
        run: |
          NDK="$ANDROID_NDK_HOME"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          # Host header required by bindgen
          sudo mkdir -p /usr/include/asm
          printf '#include <asm-generic/ioctl.h>\n' \
            | sudo tee /usr/include/asm/ioctl.h >/dev/null

          # Android NDK sysroot header required by clang/bindgen
          sudo mkdir -p "$SYSROOT/usr/include/asm"
          printf '#include <asm-generic/ioctl.h>\n' \
            | sudo tee "$SYSROOT/usr/include/asm/ioctl.h" >/dev/null

          echo "===== ioctl headers ====="
          test -f /usr/include/asm/ioctl.h
          test -f "$SYSROOT/usr/include/asm/ioctl.h"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev \
            clang \
            llvm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add armv7-linux-androideabi

      - name: Configure ARM32 Rust environment
        run: |
          NDK="$ANDROID_NDK_HOME"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          {
            echo "CC_armv7_linux_androideabi=$TOOLCHAIN/armv7a-linux-androideabi21-clang"
            echo "CXX_armv7_linux_androideabi=$TOOLCHAIN/armv7a-linux-androideabi21-clang++"
            echo "AR_armv7_linux_androideabi=$TOOLCHAIN/llvm-ar"
            echo "RANLIB_armv7_linux_androideabi=$TOOLCHAIN/llvm-ranlib"

            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$TOOLCHAIN/armv7a-linux-androideabi21-clang"

            echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--sysroot=$SYSROOT -I$SYSROOT/usr/include/arm-linux-androideabi -I$SYSROOT/usr/include"

            echo "CFLAGS_armv7_linux_androideabi=--target=armv7a-linux-androideabi21 --sysroot=$SYSROOT"
            echo "CXXFLAGS_armv7_linux_androideabi=--target=armv7a-linux-androideabi21 --sysroot=$SYSROOT"
          } >> "$GITHUB_ENV"

      - name: Verify ARM32 toolchain
        run: |
          echo "===== Compiler ====="
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang" \
            --version

          echo "===== AR ====="
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" \
            --version

          echo "===== Rust target ====="
          rustc --print target-list | grep '^armv7-linux-androideabi$'

          echo "===== ioctl ====="
          test -f "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/asm/ioctl.h"

      - name: Build ARMv7 ksud
        working-directory: userspace/ksud
        env:
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: ${{ env.CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER }}
          CC_armv7_linux_androideabi: ${{ env.CC_armv7_linux_androideabi }}
          CXX_armv7_linux_androideabi: ${{ env.CXX_armv7_linux_androideabi }}
          AR_armv7_linux_androideabi: ${{ env.AR_armv7_linux_androideabi }}
          RANLIB_armv7_linux_androideabi: ${{ env.RANLIB_armv7_linux_androideabi }}
          BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi: ${{ env.BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi }}
          CFLAGS_armv7_linux_androideabi: ${{ env.CFLAGS_armv7_linux_androideabi }}
          CXXFLAGS_armv7_linux_androideabi: ${{ env.CXXFLAGS_armv7_linux_androideabi }}
        run: |
          cargo clean

          cargo build \
            --target armv7-linux-androideabi \
            --release \
            --manifest-path Cargo.toml

      - name: Verify ARMv7 ksud
        run: |
          KSUD="userspace/ksud/target/armv7-linux-androideabi/release/ksud"

          test -f "$KSUD"

          echo "===== ksud file ====="
          file "$KSUD"

          echo "===== ksud ELF ====="
          readelf -h "$KSUD" | grep -E "Class|Machine"

      - name: Install ARMv7 ksud into Manager
        run: |
          mkdir -p manager/app/src/main/jniLibs/armeabi-v7a

          cp \
            userspace/ksud/target/armv7-linux-androideabi/release/ksud \
            manager/app/src/main/jniLibs/armeabi-v7a/libksud.so

      - name: Force Manager ARM32 ABI
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("manager/app/build.gradle.kts")
          s = p.read_text()

          if 'abiFilters += "armeabi-v7a"' not in s:
              marker = 'android {\n'
              replacement = '''android {
              defaultConfig {
                  ndk {
                      abiFilters += "armeabi-v7a"
                  }
              }
          '''
              if marker not in s:
                  raise SystemExit("Could not find android block")
              s = s.replace(marker, replacement, 1)

          p.write_text(s)
          PY

          echo "===== ABI configuration ====="
          grep -n -A5 -B2 "abiFilters" manager/app/build.gradle.kts

      - name: Build Manager ARM32
        working-directory: manager
        run: |
          chmod +x gradlew

          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Check ARM32 APK
        run: |
          mkdir -p dist

          APK=$(find manager/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"

          echo "===== APK ====="
          echo "$APK"

          echo "===== Native libraries in APK ====="
          unzip -l "$APK" | grep "lib/"

          echo "===== ARM32 libraries ====="
          unzip -l "$APK" | grep "lib/armeabi-v7a/"

          test "$(unzip -l "$APK" | grep -c 'lib/armeabi-v7a/')" -gt 0

          cp "$APK" dist/KernelSU_Next_ARM32_unsigned.apk

      - name: Align APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/zipalign" \
            -P 16 \
            -f 4 \
            dist/KernelSU_Next_ARM32_unsigned.apk \
            dist/KernelSU_Next_ARM32_aligned.apk

      - name: Sign APK
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ksu-arm32.jks" \
            -storepass "ksuarm32" \
            -keypass "ksuarm32" \
            -alias "ksu-arm32" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=KernelSU Next ARM32"

          "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" sign \
            --ks "$RUNNER_TEMP/ksu-arm32.jks" \
            --ks-key-alias "ksu-arm32" \
            --ks-pass pass:ksuarm32 \
            --key-pass pass:ksuarm32 \
            --out dist/KernelSU_Next_ARM32.apk \
            dist/KernelSU_Next_ARM32_aligned.apk

      - name: Verify final APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" verify \
            --verbose \
            dist/KernelSU_Next_ARM32.apk

          echo "===== FINAL ARM32 LIBRARIES ====="
          unzip -l dist/KernelSU_Next_ARM32.apk \
            | grep "lib/armeabi-v7a/"

          echo "===== FINAL APK ====="
          ls -lh dist/KernelSU_Next_ARM32.apk

      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v7
        with:
          name: KernelSU-Next-ARM32
          path: dist/KernelSU_Next_ARM32.apk
          retention-days: 30
